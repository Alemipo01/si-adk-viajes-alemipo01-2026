[project]
name = "travel-adk-multiagent"
version = "0.1.0"
description = ""
authors = [
    {name = "Alessandro Eddison Mio Poma",email = "mmiopom@ucvvirtual.edu.pe"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
packages = [{include = "travel_adk_multiagent", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]
